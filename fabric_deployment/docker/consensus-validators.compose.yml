    ports:
      - "18106:8080"
    networks:
      - lsb_internal
    restart: unless-stopped
    depends_on:
      - validator-01

  validator-07:
    image: lsb-ehealth-validator:1.0
    container_name: lsb-validator-07
    environment:
      LSB_VALIDATOR_ID: validator-07
      LSB_VALIDATOR_ADDR: 0.0.0.0:8080
      LSB_VALIDATOR_BATTERY: "0.44"
